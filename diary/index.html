<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZYG1PHE04J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-ZYG1PHE04J');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflective Pieces</title>
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">

  <meta name="description" content="Reflective Pieces — a personal diary of everyday moments, memories, and thoughts by lin.">
  <link rel="stylesheet" href="style.css">
  <script src="diary.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#entry">Skip to diary entry</a>
  <header class="site-header">
    <a class="home-link" href="../">lin <span aria-hidden="true">/</span> diary</a>
    <h1>Reflective Pieces<span aria-hidden="true">.</span></h1>
    <p>Everyday moments, memories, and thoughts.</p>
  </header>

  <figure class="sunrise">
    <img src="images/first-sunrise-2024.jpg" alt="The sun rising above a sea of clouds, framed by pine branches" width="1479" height="1109">
    <figcaption>The first sunrise, 2024</figcaption>
  </figure>

  <main class="diary-layout">
    <aside class="archive" aria-label="Diary archive">
      <details id="archivePanel" open>
        <summary>Archive <span aria-hidden="true">↕</span></summary>
        <div class="archive-heading" aria-hidden="true">Archive</div>
        <p class="archive-count" id="archiveCount"></p>
        <div class="archive-filters">
          <div>
            <label for="yearSelect">Year</label>
            <select id="yearSelect"></select>
          </div>
          <div>
            <label for="monthSelect">Month</label>
            <select id="monthSelect"></select>
          </div>
        </div>
        <nav aria-label="Entries in selected month">
          <ul class="archive-list" id="archiveList"></ul>
        </nav>
      </details>
      <button class="random-button" id="randomDayBtn" type="button">A random day <span aria-hidden="true">↗</span></button>
    </aside>

    <article class="entry" id="entry" aria-labelledby="entryHeading">
      <header class="entry-header">
        <p class="eyebrow">From the diary</p>
        <h2 id="entryHeading" tabindex="-1"><time id="entryDate">Loading the diary…</time></h2>
        <div class="entry-meta">
          <span id="entryPosition" role="status"></span>
          <a id="permalink" href="#entry">Link to this day <span aria-hidden="true">↗</span></a>
        </div>
      </header>
      <div class="diary-content" id="diaryContent"></div>
      <nav class="entry-navigation" aria-label="Browse diary entries">
        <button id="prevDayBtn" type="button">← Older</button>
        <button id="nextDayBtn" type="button">Newer →</button>
      </nav>
    </article>
    <noscript><p>Please enable JavaScript to browse the diary.</p></noscript>
  </main>

  <footer class="site-footer"><a href="../">Back to lin <span aria-hidden="true">↗</span></a><a href="write/">Write an entry <span aria-hidden="true">↗</span></a><span>A little space on the internet.</span></footer>

</body>
</html>
